name: Bootstrap PLDR repository

on:
  push:
    branches:
      - automation/pldr-bootstrap
    paths:
      - .github/workflows/pldr-bootstrap.yml

permissions:
  contents: write

jobs:
  create-repository:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PLDR_BOOTSTRAP_TOKEN || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.REPO_TOKEN || secrets.GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/pldr-bootstrap

      - name: Attempt to create private PLDR repository
        shell: bash
        run: |
          set +e
          result_file="pldr-bootstrap-result.txt"
          : > "$result_file"
          echo "attempted_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$result_file"
          if gh api repos/veniai/PLDR > /tmp/pldr-repo.json 2> /tmp/pldr-check.err; then
            echo "status=already_exists" >> "$result_file"
            python - <<'PY' >> "$result_file"
          import json
          with open('/tmp/pldr-repo.json', encoding='utf-8') as f:
              data = json.load(f)
          print('url=' + data.get('html_url', ''))
          print('visibility=' + data.get('visibility', ''))
          PY
          else
            gh api --method POST user/repos \
              -f name='PLDR' \
              -f description='Evidence-centered open-source intelligence workbench' \
              -F private=true \
              -F auto_init=false \
              > /tmp/pldr-create.json 2> /tmp/pldr-create.err
            rc=$?
            echo "create_exit_code=$rc" >> "$result_file"
            if [ "$rc" -eq 0 ]; then
              echo "status=created" >> "$result_file"
              python - <<'PY' >> "$result_file"
          import json
          with open('/tmp/pldr-create.json', encoding='utf-8') as f:
              data = json.load(f)
          print('url=' + data.get('html_url', ''))
          print('visibility=' + data.get('visibility', ''))
          PY
            else
              echo "status=failed" >> "$result_file"
              sed -E 's/(token|authorization|password)[^ ]*/[REDACTED]/Ig' /tmp/pldr-create.err | head -30 >> "$result_file"
            fi
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pldr-bootstrap-result
          path: pldr-bootstrap-result.txt
          retention-days: 1

      - name: Remove temporary branch
        if: always()
        shell: bash
        run: git push origin --delete automation/pldr-bootstrap || true
