name: Bootstrap PLDR via issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  create-repository:
    if: startsWith(github.event.issue.title, '[PLDR-BOOTSTRAP]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create repository or fork
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh api repos/veniai/PLDR > /tmp/existing.json 2>/tmp/existing.err
          if [ "$?" -eq 0 ]; then
            echo "result=already_exists" >> "$GITHUB_OUTPUT"
            echo "detail=https://github.com/veniai/PLDR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api --method POST user/repos \
            -f name='PLDR' \
            -f description='Evidence-centered open-source intelligence workbench' \
            -F private=true \
            -F auto_init=true \
            > /tmp/pldr-create.json 2> /tmp/pldr-create.err
          direct_rc=$?
          if [ "$direct_rc" -eq 0 ]; then
            echo "result=created_private" >> "$GITHUB_OUTPUT"
            echo "detail=$(jq -r '.html_url' /tmp/pldr-create.json)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api --method POST repos/marcosamadeo/PLDR/forks \
            -F default_branch_only=true \
            > /tmp/pldr-fork.json 2> /tmp/pldr-fork.err
          fork_rc=$?
          if [ "$fork_rc" -eq 0 ]; then
            echo "result=created_public_fork" >> "$GITHUB_OUTPUT"
            echo "detail=$(jq -r '.html_url' /tmp/pldr-fork.json)" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
            detail="direct: $(head -5 /tmp/pldr-create.err | tr '\n' ' ') fork: $(head -8 /tmp/pldr-fork.err | tr '\n' ' ')"
            detail=$(printf '%s' "$detail" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "detail=$detail" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.create.outputs.result }}
          DETAIL: ${{ steps.create.outputs.detail }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_URL" --body "PLDR bootstrap result: **$RESULT**\n\n$DETAIL"
