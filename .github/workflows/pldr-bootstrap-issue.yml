name: Bootstrap PLDR via issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  create-repository:
    if: startsWith(github.event.issue.title, '[PLDR-BOOTSTRAP]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PLDR_BOOTSTRAP_TOKEN || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.REPO_TOKEN || secrets.GH_TOKEN || github.token }}
    steps:
      - name: Create repository
        id: create
        shell: bash
        run: |
          set +e
          gh api repos/veniai/PLDR > /tmp/existing.json 2>/tmp/existing.err
          exists_rc=$?
          if [ "$exists_rc" -eq 0 ]; then
            echo "result=already_exists" >> "$GITHUB_OUTPUT"
            echo "detail=https://github.com/veniai/PLDR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api --method POST user/repos \
            -f name='PLDR' \
            -f description='Evidence-centered open-source intelligence workbench' \
            -F private=true \
            -F auto_init=true \
            > /tmp/pldr-create.json 2> /tmp/pldr-create.err
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "result=created" >> "$GITHUB_OUTPUT"
            url=$(jq -r '.html_url' /tmp/pldr-create.json)
            echo "detail=$url" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
            detail=$(head -20 /tmp/pldr-create.err | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "detail=$detail" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Report result
        env:
          RESULT: ${{ steps.create.outputs.result }}
          DETAIL: ${{ steps.create.outputs.detail }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_URL" --body "PLDR bootstrap result: **$RESULT**\n\n$DETAIL"
