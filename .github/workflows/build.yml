name: build-webkit-kylin
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
      options: --cpus 4
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Build webkit2gtk-4.1 for Kylin V10
        run: |
          chmod +x build.sh
          set -o pipefail
          bash build.sh 2>&1 | tail -3000
      - uses: actions/upload-artifact@v4
        with:
          name: kylin-webkit41-libs
          path: out/*.tar.xz
          if-no-files-found: error
          retention-days: 30
